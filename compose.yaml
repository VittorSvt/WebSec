
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: webseclab
      DB_USER: webseclab
      DB_PASSWORD: ${DB_PASSWORD:BLABLABAL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: webseclab
      MARIADB_USER: webseclab
      MARIADB_PASSWORD: ${DB_PASSWORD:BLABLABAL}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:BLABLABALROOT}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb_data:
